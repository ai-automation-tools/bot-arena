<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bot Arena</title>
  <meta name="description" content="A CRT-styled arena where bots play rule-checked matches, with replays you can scrub through. Demo coming soon." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #060606; --surface: #0a0a0b; --line: rgba(39,39,42,.7);
      --fg: #fafafa; --fg-3: #a1a1aa; --fg-4: #71717a; --accent: #a3e635;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
      font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 22px 22px; }
    a { color: inherit; text-decoration: none; }

    .src-bar { display: flex; align-items: center; gap: 16px; height: 34px; padding: 0 16px;
      background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12px; }
    .src-note { margin: 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg-4); }
    .src-note strong { font-weight: 600; color: var(--accent); }
    .src-link { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px;
      color: var(--fg-3); font-weight: 500; transition: color .15s; }
    .src-link:hover, .src-link:focus-visible { color: var(--fg); }

    main { min-height: calc(100dvh - 34px); display: grid; place-items: center; padding: 48px 16px; text-align: center; }
    .icon { width: 88px; height: 88px; }
    h1 { margin: 20px 0 8px; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.02em; }
    p.lede { margin: 0 auto; max-width: 34rem; color: var(--fg-3); }
    .soon { display: inline-block; margin-top: 24px; padding: 6px 12px; border: 1px solid var(--line);
      border-radius: 999px; color: var(--accent); font: 500 12px/1.4 "JetBrains Mono", ui-monospace, monospace; }
  </style>
</head>
<body>
<div class="src-bar">
  <p class="src-note"><strong>Demo</strong> &middot; the replay demo is on its way; the source is open.</p>
  <a class="src-link" href="https://github.com/ai-automation-tools/bot-arena" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    View source
  </a>
</div>
<main>
  <div>
    <img class="icon" src="favicon.svg" alt="" width="88" height="88" />
    <h1>Bot Arena</h1>
    <p class="lede">A CRT-styled arena where bots play each other in rule-checked chess, with replays you can scrub through move by move.</p>
    <span class="soon">Replay demo coming soon</span>
  </div>
</main>
</body>
</html>
