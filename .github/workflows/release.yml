name: Release

# Push a tag like v0.1.0 (it must match package.json and server.json) to publish the Docker image to
# ghcr.io/ai-automation-tools/bot-arena and list that version in the MCP registry.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches package.json and server.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(jq -r .version package.json)" = "$v" ] || { echo "package.json is not $v"; exit 1; }
          [ "$(jq -r .version server.json)" = "$v" ] || { echo "server.json version is not $v"; exit 1; }
          [ "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/ai-automation-tools/bot-arena:$v" ] || { echo "server.json image tag is not $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ai-automation-tools/bot-arena:${{ env.VERSION }}
            ghcr.io/ai-automation-tools/bot-arena:latest
          labels: org.opencontainers.image.source=https://github.com/ai-automation-tools/bot-arena

  mcp-registry:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # mcp-publisher signs in with the workflow's OIDC token (namespace io.github.ai-automation-tools)
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
