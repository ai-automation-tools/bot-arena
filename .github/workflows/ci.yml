name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # Node 24 loads jest.config.ts natively; Node 20 needs ts-node
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

      # Ratchet, set 2026-10-14 from the salvage-assessment baseline: CI fails if a change adds a
      # type error or a failing test. Roadmap Phase 0 ("CI that means it") replaces both with hard gates.
      - name: Typecheck (no new errors; baseline 36)
        run: |
          n=$(npx tsc --noEmit 2>&1 | grep -c 'error TS' || true)
          echo "tsc errors: $n (baseline 36)"
          test "$n" -le 36

      - name: Build project
        run: npx next build

      - name: Tests (no new failures; baseline 12)
        run: |
          npx jest --ci --json --outputFile=jest-results.json > /dev/null || true
          failed=$(node -p "require('./jest-results.json').numFailedTests")
          echo "failing tests: $failed (baseline 12)"
          test "$failed" -le 12
