name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # Node 24 loads jest.config.ts natively; Node 20 needs ts-node
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build project
        run: npx next build

      - name: Tests
        run: npx jest --ci

      - name: Example agents
        # Plays examples/python-rest and examples/node-webhook to the end against the random mover.
        run: npm run examples:test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check it serves the API
        run: |
          docker build -t bot-arena .
          docker run -d --name arena -p 127.0.0.1:9002:9002 bot-arena
          for i in $(seq 1 30); do curl -sf http://localhost:9002/api/matches && exit 0; sleep 2; done
          docker logs arena; exit 1
