name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'   # Node 24 loads jest.config.ts natively; Node 20 needs ts-node
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Audit shipped dependencies
        # Fails on a critical advisory in anything the app ships. Not `high` yet: Tailwind 3's file watcher
        # (picomatch and friends) carries 10 highs that only Tailwind 4 clears; tighten this then.
        run: npm audit --omit=dev --audit-level=critical
      
      - name: Run linter
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build project
        run: npx next build

      - name: Tests
        run: npx jest --ci

      - name: Example agents
        # Plays examples/python-rest and examples/node-webhook to the end against the random mover.
        run: npm run examples:test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and check it serves the API
        run: |
          docker build -t bot-arena .
          docker run -d --name arena -p 127.0.0.1:9002:9002 bot-arena
          for i in $(seq 1 30); do curl -sf http://localhost:9002/api/matches && curl -sf http://localhost:9002/api/health && exit 0; sleep 2; done
          docker logs arena; exit 1

      - name: Docker's healthcheck passes with an access key set
        # The healthcheck calls /api/health, which needs no key; it used to call /api/matches and fail with one.
        run: |
          docker run -d --name keyed -e ARENA_API_KEY=ci-only-key bot-arena
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' keyed)" = healthy ] && exit 0; sleep 3; done
          docker inspect -f '{{json .State.Health}}' keyed; docker logs keyed; exit 1
